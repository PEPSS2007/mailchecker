[project]
name = "mailchecker"
version = "1.0.0"
description = "High-accuracy, privacy-first email deliverability verification web service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "email-validator>=2.1.0",
    "dnspython>=2.6.0",
    "aiosmtplib>=3.0.1",
    "cachetools>=5.3.3",
    "slowapi>=0.1.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
